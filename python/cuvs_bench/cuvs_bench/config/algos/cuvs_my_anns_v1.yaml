name: cuvs_my_anns_v1
constraints:
  build: cuvs_bench.config.algos.constraints.cuvs_my_anns_v1_build
  search: cuvs_bench.config.algos.constraints.cuvs_my_anns_v1_search
groups:
  base:
    build:
      # graph_degree: [16, 32, 48, 128]
      graph_degree: [16, 32, 48, 64, 96, 128]
      intermediate_graph_degree: [16, 32, 48, 64, 96, 128]
      graph_build_algo: ["NN_DESCENT"]
    search:
      # must be multiple of 32
      # itopk: [128, 256, 512]
      # itopk: [32, 64]
      itopk: [32, 64, 128, 256, 512]
      # search_width: [1]
      search_width: [1, 2, 4]
      # 16384: oom
      num_entry_points: [0, 32, 64, 128, 256, 512, 1024, 2048, 4096]
      # hash_mode: ["auto", "cache", "always_unvisited"]
      hash_mode: ["auto"]
      algo: ["auto"]
  warp_distance:
    build:
      graph_degree: [16, 32, 48, 64, 96, 128]
      intermediate_graph_degree: [16, 32, 48, 64, 96, 128]
      graph_build_algo: ["NN_DESCENT"]
    search:
      # must be multiple of 32
      # itopk: [128, 256, 512]
      # itopk: [32, 64]
      itopk: [32, 64, 128]
      search_width: [1]
      # search_width: [1, 2, 4]
      # 16384: oom
      num_entry_points: [0]
      # hash_mode: ["auto", "cache", "always_unvisited"]
      hash_mode: ["auto"]
      algo: ["single_neighbor_list_multi_cta_v1"]
      # algo: ["single_neighbor_list_multi_cta_v1", "single_neighbor_list_multi_cta_v2", "multi_cta", "single_cta"]
      thread_block_size: [64, 128]
  warp_distance_ncu:
    build:
      graph_degree: [64]
      # graph_degree: [16, 32, 48, 64, 96, 128]
      intermediate_graph_degree: [96]
      graph_build_algo: ["NN_DESCENT"]
    search:
      # must be multiple of 32
      # itopk: [128, 256, 512]
      # itopk: [32, 64]
      itopk: [32]
      search_width: [1]
      # search_width: [1, 2, 4]
      # 16384: oom
      num_entry_points: [0]
      # hash_mode: ["auto", "cache", "always_unvisited"]
      hash_mode: ["auto"]
      algo: ["single_neighbor_list_multi_cta_v2", "multi_cta"]
